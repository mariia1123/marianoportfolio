<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Projects — Mariano Cánovas</title>
<meta name="description" content="SQL projects by Mariano Cánovas Martínez">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f5f3;
    --bg-2: #ebebe8;
    --surface: #ffffff;
    --surface-tint: #f0f0ed;
    --ink: #0a0a0a;
    --muted: #5a5a58;
    --dim: #8e8e8c;
    --border: #e2e2df;
    --accent: #e38c00;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  body.dark-mode {
    --bg: #0d0d0d;
    --bg-2: #161616;
    --surface: #1a1a1a;
    --surface-tint: #222222;
    --ink: #f5f5f3;
    --muted: #a0a0a0;
    --dim: #666666;
    --border: #2a2a2a;
  }

  * { box-sizing: border-box; }
  *::selection { background: #22c55e; color: #ffffff; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s, color 0.4s;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Top controls */
  #top-controls {
    position: fixed; top: 20px; right: 24px; z-index: 100;
    display: flex; gap: 8px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink); }

  /* Header / nav */
  .nav-bar {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 24px 0;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .back-link:hover {
    color: var(--ink);
    border-color: var(--ink);
    transform: translateX(-3px);
  }

  /* Page header */
  .page-header {
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 24px 40px;
    display: flex;
    align-items: center;
    gap: 18px;
    animation: fadeUp 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .lang-badge {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: #e38c00;
    color: white;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    flex-shrink: 0;
  }
  .page-title h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .page-title p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }

  /* Project cards */
  .content {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }

  .project {
    display: block;
    margin-bottom: 28px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .project:not(.placeholder):hover { transform: translateY(-4px); }
  .project-media {
    width: 100%;
    aspect-ratio: 16/10;
    border-radius: 18px;
    background: var(--surface-tint);
    overflow: hidden;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .project:not(.placeholder):hover .project-media {
    border-color: rgba(34,197,94,0.3);
    box-shadow: 0 14px 40px rgba(0,0,0,0.08);
  }
  .project-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .project-desc {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-state svg {
    width: 48px; height: 48px;
    margin-bottom: 16px;
    color: var(--dim);
  }
  .empty-state h3 {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .empty-state p {
    font-size: 14px;
    margin: 0;
    line-height: 1.6;
  }

  /* Footer */
  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap; gap: 12px;
  }
  footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 600px) {
    .page-header { padding: 40px 20px 30px; }
    .lang-badge { width: 48px; height: 48px; font-size: 16px; }
    .nav-bar { padding: 20px 20px 0; }
    #top-controls { top: 14px; right: 14px; }
    .icon-btn { width: 32px; height: 32px; }
  }
</style>
</head>
<body>

<!-- Top controls -->
<div id="top-controls">
  <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
    <svg id="moon-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <svg id="sun-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</div>

<!-- Back to home -->
<nav class="nav-bar">
  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>
</nav>

<!-- Page header -->
<header class="page-header">
  <div class="lang-badge">SQL</div>
  <div class="page-title">
    <h1>SQL Projects</h1>
    <p>Database queries, data manipulation, and analysis.</p>
  </div>
</header>

<!-- Projects -->
<main class="content">

  <!--
       =======================================================================
       HOW TO ADD A PROJECT:
       Copy the block below, replace the placeholder text and image,
       and remove the "placeholder" class to enable the hover effect.

       <a class="project" href="#">
         <div class="project-media">
           <img src="path/to/screenshot.png" alt="Project name" style="width:100%;height:100%;object-fit:cover;">
         </div>
         <div class="project-title">My Cool Project</div>
         <div class="project-desc">A short description of what it does.</div>
       </a>
       =======================================================================
  -->

  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>
    <h3>Coming soon</h3>
    <p>I'm currently working on projects in SQL.<br>Check back soon!</p>
  </div>

</main>

<!-- Footer -->
<footer>
  <div>Mariano Cánovas © 2026 · Built in Rotterdam</div>
  <div><a href="mailto:marianockiwi@gmail.com">marianockiwi@gmail.com</a></div>
</footer>

<script>
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-mode');
  document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
  document.getElementById('sun-icon').style.display  = isDark ? 'block' : 'none';
  try { localStorage.setItem('mariano-theme', isDark ? 'dark' : 'light'); } catch(e) {}
}
(function() {
  try {
    if (localStorage.getItem('mariano-theme') === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('moon-icon').style.display = 'none';
      document.getElementById('sun-icon').style.display = 'block';
    }
  } catch(e) {}
})();
</script>

</body>
</html>
