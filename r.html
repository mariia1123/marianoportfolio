<style>
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --surface-tint: #f0f0ed;
    --ink: #0a0a0a;
    --muted: #5a5a58;
    --dim: #8e8e8c;
    --border: #e2e2df;
    --accent: #276DC3;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  body.dark-mode {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface-tint: #222222;
    --ink: #f5f5f3;
    --muted: #a0a0a0;
    --dim: #666666;
    --border: #2a2a2a;
  }

  * { box-sizing: border-box; }
  *::selection { background: #22c55e; color: #ffffff; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s, color 0.4s;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  #top-controls {
    position: fixed; top: 20px; right: 24px; z-index: 100;
    display: flex; gap: 8px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink); }

  .nav-bar {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 0;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .back-link:hover {
    color: var(--ink);
    border-color: var(--ink);
    transform: translateX(-3px);
  }

  .page-header {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 24px 40px;
    display: flex;
    align-items: center;
    gap: 18px;
    animation: fadeUp 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .lang-badge {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: #276DC3;
    color: white;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    flex-shrink: 0;
  }
  .page-title h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .page-title p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }

  .content {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }

  /* Controls row */
  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  /* Sort controls */
  .sort-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sort-controls label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sort-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  .sort-toggle button {
    padding: 7px 12px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    font-family: var(--sans);
  }
  .sort-toggle button.active {
    background: var(--accent);
    color: white;
  }
  .sort-toggle button:hover:not(.active) {
    color: var(--ink);
  }

  /* Tab filters */
  .filter-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
    flex: 1;
  }
  .filter-tabs::-webkit-scrollbar {
    height: 4px;
  }
  .filter-tabs::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  .filter-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    white-space: nowrap;
    user-select: none;
  }
  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--ink);
  }
  .filter-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .filter-count {
    font-family: var(--mono);
    font-size: 11px;
    margin-left: 4px;
    opacity: 0.7;
  }

  /* Layout with preview */
  .layout-wrapper {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
  }

  /* Projects grid */
  .projects-grid {
    display: grid;
    gap: 16px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Project card */
  .project-mini {
    display: flex;
    gap: 14px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    align-items: flex-start;
  }
  .project-mini:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
  }
  .project-icon {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .project-info {
    flex: 1;
    min-width: 0;
  }
  .project-title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .project-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 8px;
    line-height: 1.4;
  }
  .project-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .project-meta span {
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .project-arrow {
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s;
  }
  .project-mini:hover .project-arrow {
    color: var(--accent);
    transform: translateX(3px);
  }

  .preview-panel {
    position: sticky;
    top: 100px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    height: fit-content;
    animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 14px;
  }

    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pdf-card {
    background: var(--surface-tint);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
  }
  .pdf-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(39, 109, 195, 0.1);
    transform: translateY(-2px);
  }

  .pdf-thumbnail {
    width: 100%;
    height: 120px;
    background-size: cover;
    background-position: center;
    border-bottom: 1px solid var(--border);
  }

  .pdf-info {
    padding: 10px;
  }

  .pdf-badge {
    font-size: 10px;
    color: var(--accent);
    font-weight: 700;
    font-family: var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }

  .pdf-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    margin: 0;
    line-height: 1.3;
  }

  .empty-preview {
    text-align: center;
    padding: 20px 0;
    color: var(--muted);
    font-size: 12px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }

    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 12px;

    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover {
    color: var(--ink);
  }

  @media (max-width: 1024px) {
    .layout-wrapper {
      grid-template-columns: 1fr;
    }
    .preview-panel {
      position: static;
      margin-bottom: 20px;
    }
  }

  @media (max-width: 600px) {
    .page-header { padding: 40px 20px 30px; }
    .lang-badge { width: 48px; height: 48px; font-size: 16px; }
    .controls-row { gap: 12px; margin-bottom: 20px; padding-bottom: 20px; flex-direction: column; }
    .sort-controls { flex-direction: column; align-items: flex-start; width: 100%; }
    .filter-tabs { width: 100%; }
    .nav-bar { padding: 20px 20px 0; }
    #top-controls { top: 14px; right: 14px; gap: 6px; }
    .icon-btn { width: 32px; height: 32px; }
  }
</style>

let currentFilter = 'All';
let currentSort = 'newest';

function renderTabs() {
  const tabsContainer = document.getElementById('filterTabs');
  tabsContainer.innerHTML = '';

  const categories = ['All', ...new Set(projectsData.map(p => p.categoryShort))];
  const counts = {};
  counts['All'] = projectsData.length;
  projectsData.forEach(p => {
    counts[p.categoryShort] = (counts[p.categoryShort] || 0) + 1;
  });

  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    if (cat === currentFilter) btn.classList.add('active');
    btn.innerHTML = `${cat}<span class="filter-count">${counts[cat]}</span>`;
    btn.onclick = () => filterProjects(cat);
    tabsContainer.appendChild(btn);
  });
}

function updatePreview() {
  const pdfCardsContainer = document.getElementById('pdfCards');
  
  let filtered = projectsData.filter(p => 
    currentFilter === 'All' || p.categoryShort === currentFilter
  );

  if (filtered.length === 0 || currentFilter === 'All') {
    pdfCardsContainer.innerHTML = '<div class="empty-preview">Select a course to view assignments</div>';
    return;
  }

  pdfCardsContainer.innerHTML = filtered.map(proj => `
    <a href="${proj.pdfUrl}" target="_blank" class="pdf-card" rel="noopener noreferrer">
      <div class="pdf-thumbnail" style="background-image: url('${proj.pdfThumb}')"></div>
      <div class="pdf-info">
        <div class="pdf-badge">${proj.categoryShort}</div>
        <p class="pdf-title">${proj.title}</p>
      </div>
    </a>
  `).join('');
}

function filterProjects(category) {
  currentFilter = category;
  renderTabs();
  renderProjects();
  updatePreview();
}

function sortProjects(order) {
  currentSort = order;
  document.querySelectorAll('.sort-toggle button').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  renderProjects();
}

function renderProjects() {
  const grid = document.getElementById('projectsGrid');
  
  let filtered = projectsData.filter(p => 
    currentFilter === 'All' || p.categoryShort === currentFilter
  );

  filtered.sort((a, b) => {
    const dateA = new Date(a.date);
    const dateB = new Date(b.date);
    return currentSort === 'newest' ? dateB - dateA : dateA - dateB;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>No projects found.</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(proj => `
    <a class="project-mini" href="${proj.url}">
      <div class="project-icon" style="background-image: url('${proj.icon}'); background-size: cover; background-position: center;"></div>
      <div class="project-info">
        <div class="project-title">${proj.title}</div>
        <div class="project-desc">${proj.desc}</div>
        <div class="project-meta">${proj.meta.map(m => `<span>${m}</span>`).join('')}</div>
      </div>
      <svg class="project-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  `).join('');
}

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark-mode');
  document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
  document.getElementById('sun-icon').style.display = isDark ? 'block' : 'none';
  try { localStorage.setItem('mariano-theme', isDark ? 'dark' : 'light'); } catch(e) {}
}

// Init
(function() {
  try {
    if (localStorage.getItem('mariano-theme') === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('moon-icon').style.display = 'none';
      document.getElementById('sun-icon').style.display = 'block';
    }
  } catch(e) {}
  renderTabs();
  renderProjects();
})();
</script>
